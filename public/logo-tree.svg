<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7A9"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#E5C378"/>
    </linearGradient>
    <linearGradient id="darkGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19483A"/>
      <stop offset="50%" stop-color="#0F2E23"/>
      <stop offset="100%" stop-color="#081A14"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Circular Ring with Ornaments -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>
  <circle cx="250" cy="250" r="225" fill="url(#darkGreenGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="250" cy="250" r="217" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4, 4" opacity="0.75"/>

  <!-- Top Arch Arc Path for Text -->
  <path id="archTextPathTop" d="M 75 250 A 175 175 0 0 1 425 250" fill="none"/>
  <text fill="url(#goldGrad)" font-family="'Cinzel', 'Playfair Display', serif" font-size="19" font-weight="700" letter-spacing="3" text-anchor="middle">
    <textPath href="#archTextPathTop" startOffset="50%">
      BADHAADHAA RAGGAASAA WAYYEESSAA
    </textPath>
  </text>

  <!-- Memorial Sacred Tree (Oda Tree / Tree of Life Symbol) -->
  <g transform="translate(250, 240) scale(1.15)">
    <!-- Tree Trunk and Roots -->
    <path d="M -7 45 C -7 20, -18 5, -2 0 C 18 5, 7 20, 7 45 C 18 50, 28 60, 35 68 C 15 65, 0 52, 0 52 C 0 52, -15 65, -35 68 C -28 60, -18 50, -7 45 Z" fill="url(#goldGrad)"/>
    
    <!-- Branches -->
    <path d="M 0 5 C -25 -15, -45 -10, -55 -28 C -35 -24, -20 -10, -5 -2 C -5 -2, -2 -25, -22 -45 C -8 -38, 2 -22, 2 -8 C 5 -20, 18 -42, 35 -38 C 22 -30, 10 -15, 7 -2 C 20 -8, 42 -18, 55 -5 C 40 -3, 20 2, 7 8 Z" fill="url(#goldGrad)"/>
    
    <!-- Canopy Foliage Clusters -->
    <ellipse cx="0" cy="-45" rx="36" ry="24" fill="url(#goldGrad)" opacity="0.95"/>
    <ellipse cx="-42" cy="-28" rx="28" ry="18" fill="url(#goldGrad)" opacity="0.9"/>
    <ellipse cx="42" cy="-28" rx="28" ry="18" fill="url(#goldGrad)" opacity="0.9"/>
    <ellipse cx="-25" cy="-55" rx="22" ry="16" fill="url(#goldGrad)" opacity="0.92"/>
    <ellipse cx="25" cy="-55" rx="22" ry="16" fill="url(#goldGrad)" opacity="0.92"/>
    <ellipse cx="0" cy="-68" rx="20" ry="14" fill="url(#goldGrad)"/>

    <!-- Subtle Leaf Detail Cutouts -->
    <circle cx="0" cy="-45" r="4" fill="#0F2E23"/>
    <circle cx="-25" cy="-35" r="3.5" fill="#0F2E23"/>
    <circle cx="25" cy="-35" r="3.5" fill="#0F2E23"/>
  </g>

  <!-- Central BRW Monogram Ribbon / Emblem -->
  <g transform="translate(250, 355)">
    <!-- Shield / Badge Backing -->
    <rect x="-65" y="-18" width="130" height="34" rx="17" fill="#081712" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <!-- BRW Monogram Text -->
    <text x="0" y="7" fill="url(#goldGrad)" font-family="'Cinzel', 'Playfair Display', serif" font-size="22" font-weight="800" letter-spacing="4" text-anchor="middle">
      B • R • W
    </text>
  </g>

  <!-- Years of Honor Ribbon -->
  <text x="250" y="415" fill="#E5C378" font-family="'Cinzel', serif" font-size="14" font-weight="600" letter-spacing="3" text-anchor="middle" opacity="0.85">
    1943 — 2018
  </text>

  <!-- Subtle Bottom Star / Flourish -->
  <path d="M 250 432 L 253 440 L 261 443 L 253 446 L 250 454 L 247 446 L 239 443 L 247 440 Z" fill="url(#goldGrad)"/>
</svg>

